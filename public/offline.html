<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17211d" />
    <title>Bağlantı kesildi | Adisyon Web</title>
    <style>
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f4f6f8; color: #17211d; font-family: Inter, "Segoe UI", Arial, sans-serif; }
      main { width: 100%; max-width: 430px; padding: 32px; text-align: center; border: 1px solid #dfe5e1; border-radius: 28px; background: white; box-shadow: 0 24px 70px rgb(23 33 29 / 8%); }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 24px 0 0; font-size: 28px; letter-spacing: -0.03em; }
      p { margin: 12px 0 0; color: #68736e; font-size: 14px; line-height: 1.7; }
      button { min-height: 48px; margin-top: 28px; border: 0; border-radius: 12px; padding: 0 24px; background: #17211d; color: white; font: inherit; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 3px solid #eaa48e; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/app-icon-192.png" alt="" />
      <h1>Bağlantı kesildi</h1>
      <p>Güvenli sipariş ve ödeme işlemleri için internet bağlantısı gerekiyor. Bağlantınızı kontrol edip yeniden deneyin.</p>
      <button type="button" onclick="location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
